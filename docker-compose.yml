name: market-truffler

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-truffler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truffler}
      POSTGRES_DB: ${POSTGRES_DB:-market_truffler}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - market-truffler
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-truffler} -d ${POSTGRES_DB:-market_truffler}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # No published port: PostgreSQL is only reachable from other containers
    # on the internal network, never from the host or the public internet.

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-truffler}:${POSTGRES_PASSWORD:-truffler}@postgres:5432/${POSTGRES_DB:-market_truffler}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set — see .env.example}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-10080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      # Loopback only by default (audit F-09): the web container reaches
      # the API over the compose network, not this port. Set API_BIND=0.0.0.0
      # to expose it on the LAN deliberately.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      # OINK CORP's app/scripts/generate_research_dataset.py writes here.
      # Without this mount, output written inside the container is lost on
      # the next `docker compose up --build` — the rest of the api service
      # has no volumes because nothing else it does needs to survive a
      # rebuild; this one artifact deliberately must.
      - ./research/oink_corp/data:/app/research_data
      # OINK CORP experiment specs (committed, read-only): run with
      # `python -m app.scripts.run_experiment --spec /app/research_experiments/<id>.json`.
      - ./research/oink_corp/experiments:/app/research_experiments:ro
      # OINK CORP campaigns and their reports (committed, read-only), shown by
      # the Research Explorer (/api/research/campaigns/...).
      - ./research/oink_corp/campaigns:/app/research_campaigns:ro
      # OINK CORP knowledge ledgers (committed revisions, read-only).
      - ./research/oink_corp/knowledge:/app/research_knowledge:ro
      # OINK CORP ranking candidates and studies (committed, read-only).
      - ./research/oink_corp/ranking:/app/research_ranking:ro
    networks:
      - market-truffler
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # OINK CORP research data continuity worker (app/scripts/research_continuity.py):
  # turns each completed UTC day of Sniffer frames into a verified, immutable
  # 15-minute research shard in research/oink_corp/data. Same image as `api`,
  # but never runs migrations (entrypoint overridden) and only starts once
  # `api` — which migrates on start — is healthy; it additionally refuses to
  # generate until the database is at this image's Alembic head. Capped at one
  # CPU and it yields around live 5-minute frame boundaries so Sniffer keeps
  # priority. Backups go to RESEARCH_BACKUP_DIR only when a local override mounts
  # independent storage there (see docs/OPERATIONS.md); otherwise datasets exist
  # only here and Vitals says so.
  research:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    entrypoint: []
    command: ["python", "-m", "app.scripts.research_continuity", "--loop"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-truffler}:${POSTGRES_PASSWORD:-truffler}@postgres:5432/${POSTGRES_DB:-market_truffler}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set — see .env.example}
      # Independent backup destination (mounted via docker-compose.override.yml;
      # see docs/ARCHITECTURE.md's runbook). Empty = not configured.
      RESEARCH_BACKUP_DIR: ${RESEARCH_BACKUP_DIR:-}
    volumes:
      - ./research/oink_corp/data:/app/research_data
      # Read-only, for the registration readiness the worker reports
      # (app.research.readiness verifies each registration against its
      # campaign/experiment specs or ranking/qualification specs).
      - ./research/oink_corp/campaigns:/app/research_campaigns:ro
      - ./research/oink_corp/experiments:/app/research_experiments:ro
      - ./research/oink_corp/ranking:/app/research_ranking:ro
    cpus: 1.0
    # Healthy only while the worker's own minute heartbeat is fresh — "Up"
    # alone says nothing about a hung loop. Visibility only: Docker does not
    # restart unhealthy containers; `restart` covers crashes.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys
          from datetime import UTC, datetime
          w = json.load(open("/app/research_data/continuity/status.json")).get("worker", {})
          age = (datetime.now(UTC) - datetime.fromisoformat(w["heartbeat_at"])).total_seconds()
          sys.exit(0 if age < 300 and not w.get("stopped_at") else 1)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - market-truffler

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
    ports:
      # Loopback only by default; WEB_BIND=0.0.0.0 exposes it on the LAN.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    networks:
      - market-truffler

networks:
  market-truffler:
    driver: bridge

volumes:
  postgres_data:
